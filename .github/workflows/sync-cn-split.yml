name: 每周同步 CN Split Tunnels 到 Cloudflare Zero Trust
# 默认最小权限；写权限只在 keepalive job 内单独授予（见 jobs.keepalive.permissions）。
permissions:
  contents: read

on:
  schedule:
    - cron: '0 3 * * 0'  # 每周日北京时间11:00（UTC 3:00）
  workflow_dispatch:         # 手动触发按钮

concurrency:
  group: sync-cn-split
  cancel-in-progress: false   # 定时与手动触发不并发，避免保活推送被拒

jobs:
  sync:
    name: 同步 Split Tunnels
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # 不把 token 落到工作区，第三方依赖安装代码读不到

      - name: 设置 Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install --disable-pip-version-check -r requirements.txt

      - name: 运行同步脚本
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_PROFILE_ID: ${{ secrets.CF_PROFILE_ID }}
          MODE: exclude                     # 可改成 include
        run: python cf-zt-cn-split.py

  keepalive:
    name: 保活提交
    needs: sync
    # 同步失败也要保活：仓库一旦长期无提交，public 仓库的 scheduled workflow
    # 会在 60 天后被 GitHub 自动停用，这里正是为了重置该计时。
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 检出默认分支
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 必须检出默认分支：workflow_dispatch 可以指定任意分支，若沿用该分支，
          # 保活提交会把该分支的历史一并推入默认分支
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0          # 完整历史，保证 rebase 在浅克隆下也能正常工作

      - name: 更新时间戳并推送
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          echo "last-sync: $(date -u '+%Y-%m-%dT%H:%M:%SZ')" > .last-sync
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .last-sync
          if git diff --cached --quiet; then
            echo "last-sync 内容未变化，跳过提交"
            exit 0
          fi
          git commit -m "keepalive: $(date -u '+%Y-%m-%d %H:%M UTC')"
          git fetch --no-tags origin "+refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
          git rebase "origin/$DEFAULT_BRANCH"
          git push origin "HEAD:$DEFAULT_BRANCH"
